name: Build & Push Docker image (mosquitto)

on:
  schedule:
    - cron: "0 0 * * 2,5"
  push:
    paths:
      - "mosquitto/**"
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      registry:
        description: "Container registry to push"
        required: true
        default: registry.cn-chengdu.aliyuncs.com
        type: choice
        options:
          - ghcr.io
          - registry.cn-chengdu.aliyuncs.com

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}-mosquitto
  cancel-in-progress: true

env:
  REGISTRY: ${{ inputs.registry || 'registry.cn-chengdu.aliyuncs.com' }}
  IMAGE_NAME: le2-tech/mosquitto

jobs:
  meta:
    runs-on: ubuntu-26.04
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@master
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - short: amd64
            platform: linux/amd64
            runs_on: ubuntu-26.04
          - short: arm64
            platform: linux/arm64
            runs_on: ubuntu-26.04-arm
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@master

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && env.REGISTRY == 'ghcr.io'
        uses: docker/login-action@master
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun CR
        if: github.event_name != 'pull_request' && env.REGISTRY == 'registry.cn-chengdu.aliyuncs.com'
        uses: docker/login-action@master
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build & push (native ${{ matrix.platform }})
        uses: docker/build-push-action@master
        with:
          context: ./mosquitto
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.short }}
          labels: ${{ needs.meta.outputs.labels }}
          cache-from: type=gha,version=2
          cache-to: type=gha,version=2,mode=min
          sbom: false
          provenance: false

      - name: Verify & summarize
        if: success()
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.short }}"
          echo "## $IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker run --rm "$IMAGE_REF" sh -c "id ; mosquitto --version ;" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  manifest:
    needs: [meta, build]
    runs-on: ubuntu-26.04
    if: github.event_name != 'pull_request'
    steps:
      - name: Login to GHCR
        if: env.REGISTRY == 'ghcr.io'
        uses: docker/login-action@master
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun CR
        if: env.REGISTRY == 'registry.cn-chengdu.aliyuncs.com'
        uses: docker/login-action@master
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Create & push multi-arch manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          set -Eeuxo pipefail

          TAG_ARGS=""
          while IFS= read -r tag; do
            tag="$(echo "$tag" | xargs)"
            [ -z "$tag" ] && continue
            TAG_ARGS="$TAG_ARGS --tag $tag"
          done <<< "$TAGS"

          docker buildx imagetools create             $TAG_ARGS             "$IMAGE:${GITHUB_SHA}-amd64"             "$IMAGE:${GITHUB_SHA}-arm64"

      - name: Inspect (debug)
        run: |
          first_tag="$(printf "%s\n" "${{ needs.meta.outputs.tags }}" | head -n1)"
          docker buildx imagetools inspect "$first_tag"
